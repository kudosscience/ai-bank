[package]
name = "clawbank"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[[bin]]
name = "clawbank"
path = "src/main.rs"

[dependencies]
clawbank-identity = { version = "0.1.0", path = "../clawbank-identity" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
