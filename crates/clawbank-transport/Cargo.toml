[package]
name = "clawbank-transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false

[dependencies]
clawbank-identity = { version = "0.1.0", path = "../clawbank-identity" }
futures = "0.3"
libp2p-core = "0.41"
libp2p-noise = "0.44"
libp2p-tcp = { version = "0.41", features = ["tokio"] }
multiaddr = "0.18"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }
