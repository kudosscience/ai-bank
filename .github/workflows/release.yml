# CD: tag-driven releases with Sigstore/Rekor attestation.
# - `v*` tags: full release. Gates: SAFETY.md Version header must equal
#   the tag, and a docs/safety/risk-report-* must exist (ADR 0005/0006).
# - `safety/v*` tags: policy-only check (SAFETY.md header == tag).
# Every pushed tag matching v*, safety/v*, or pause/* must be signed —
# the verify-tag job tries OpenPGP then SSH (`git verify-tag`, falling
# back to `git -c gpg.format=ssh verify-tag`; keys in-repo at
# docs/safety/MAINTAINER_PUBKEYS.asc and
# .github/trusted-keys/allowed_signers), backing the tag-protection
# ruleset created by scripts/ci/apply-tag-protection.sh.
# Today there is no code, so the artifact is the docs bundle; extend the
# artifact step with cargo binaries when the workspace lands. Attestation
# uses GitHub's Sigstore-backed provenance (public Rekor); verify with
# `gh attestation verify <file> --repo kudosscience/clawbank`, fully
# offline with bundle plus trust root per docs/safety/verify-runbook.md.
# The hygiene job fails the release if the bundle holds anything but
# digests plus summaries (no IPs, multiaddrs, or key material, ADR 0005),
# scanning extracted .tar.gz members as well as loose files (gzip hides
# member bytes from direct grep) and failing closed on unreadable archives.

name: Release

on:
  push:
    tags:
      - "v*"
      - "safety/v*"

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      kind: ${{ steps.v.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == safety/* ]]; then
            echo "kind=safety" >> "$GITHUB_OUTPUT"
            echo "version=${tag#safety/v}" >> "$GITHUB_OUTPUT"
          else
            echo "kind=code" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi
      - run: bash scripts/ci/release-gate.sh "${{ steps.v.outputs.kind }}" "${{ steps.v.outputs.version }}"

  verify-tag:
    name: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - run: |
          # Trust the in-repo maintainer keys before verifying, so the
          # check depends on the repo, not on any server-side keyring.
          # Tags may be cut with either GPG (MAINTAINER_PUBKEYS.asc) or
          # SSH (trusted-keys/allowed_signers): try OpenPGP first, then
          # SSH via gpg.format=ssh (verify-tag defaults to OpenPGP and
          # rejects SSH signatures without it).
          gpg --import docs/safety/MAINTAINER_PUBKEYS.asc 2>/dev/null || true
          git config gpg.ssh.allowedSignersFile .github/trusted-keys/allowed_signers || true
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            safety/*|pause/*|v*)
              if git verify-tag "$tag" 2>/dev/null; then
                echo "verify-tag: $tag GPG signature OK"
              else
                git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=.github/trusted-keys/allowed_signers verify-tag "$tag"
              fi
              ;;
            *) echo "verify-tag: ref $tag is not a release tag (nothing to verify)" ;;
          esac

  artifact:
    name: artifact
    needs: gate
    if: needs.gate.outputs.kind == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dist
          tar --exclude=.git -czf "dist/clawbank-docs-${GITHUB_REF_NAME}.tar.gz" \
            docs CONTEXT.md AGENTS.md CLAUDE.md SAFETY.md 2>/dev/null || \
          tar --exclude=.git -czf "dist/clawbank-docs-${GITHUB_REF_NAME}.tar.gz" \
            docs CONTEXT.md AGENTS.md CLAUDE.md
          (cd dist && sha256sum -- *) | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifact
          path: dist/

  attest:
    name: attest
    needs: [gate, verify-tag, artifact, hygiene]
    if: needs.gate.outputs.kind == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifact
          path: dist/
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

  hygiene:
    name: hygiene
    needs: [gate, artifact]
    if: needs.gate.outputs.kind == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: release-artifact
          path: dist/
      - run: bash scripts/ci/attestation-hygiene.sh dist/

  publish:
    name: publish
    needs: [gate, artifact, attest, hygiene]
    if: needs.gate.outputs.kind == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifact
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
