# CI: docs checks plus the Rust quality gate. The rust-* jobs invoke
# scripts/ci/rust-check.sh (never bare `cargo` commands) so CI runs the
# exact suite developers run locally; scripts/ci/ci-sync-check.sh (ci-sync
# job) fails the build if a bare cargo run-step is ever added back.
# Rust jobs gate every post-checkout step on a manifest probe, so they
# report success-with-skipped-steps on branches without a Cargo workspace.
# See ADR 0005/0006 for the safety/harness rationale.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-lint:
    name: docs-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
          config: .github/.markdownlint-cli2.jsonc

  adr-check:
    name: adr-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/adr-check.sh

  link-check:
    name: link-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --timeout 20
            --max-concurrency 8
            --accept 200,201,202,203,204,206,301,302,303,307,308
            "**/*.md"

  context-check:
    name: context-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/context-check.sh

  ci-sync:
    name: ci-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/ci-sync-check.sh

  # NOTE: hashFiles() is not allowed in jobs.<id>.if, so each rust job
  # always runs but gates every step after checkout on a file probe.
  # Jobs report success-with-skipped-steps until the workspace lands.
  rust-fmt:
    name: rust-fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: gate
        run: echo "cargo=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.cargo == 'true'
        with:
          components: rustfmt
      - if: steps.gate.outputs.cargo == 'true'
        run: bash scripts/ci/rust-check.sh fmt

  rust-clippy:
    name: rust-clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - id: gate
        run: echo "cargo=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.cargo == 'true'
        with:
          components: clippy
      - if: steps.gate.outputs.cargo == 'true'
        run: bash scripts/ci/rust-check.sh clippy

  rust-test:
    name: rust-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: gate
        run: echo "cargo=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.cargo == 'true'
      - if: steps.gate.outputs.cargo == 'true'
        run: bash scripts/ci/rust-check.sh test

  rust-audit:
    name: rust-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: gate
        run: echo "lock=$([ -f Cargo.lock ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.lock == 'true'
      - uses: taiki-e/install-action@v2
        if: steps.gate.outputs.lock == 'true'
        with:
          tool: cargo-audit
      - uses: taiki-e/install-action@v2
        if: steps.gate.outputs.lock == 'true'
        with:
          tool: cargo-deny
      - if: steps.gate.outputs.lock == 'true'
        run: bash scripts/ci/rust-check.sh audit
